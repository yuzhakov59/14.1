[project]
name = "14-1"
version = "0.1.0"
description = ""
authors = [
    {name = "yuzhakov",email = "yuzhakov.a.a@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]
dev = [
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.isort]
lines_after_imports = 2

[tool.black]
line-length = 119

[flake8]
max-line-length = 119

[tool.flake8]
max-line-length = 119
